<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Cinema Sync - Sincronización de Lightsticks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            background-color: #8A2BE2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-bluetooth {
            background-color: #00cec9;
            color: #121212;
        }
        .circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 20px auto;
            border: 3px solid #ffffff;
            background-color: #000000;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Ingreso -->
        <div id="loginScreen">
            <h2>Conectar a Sala</h2>
            <input type="text" id="roomInput" placeholder="Ej. Sala-1">
            <button onclick="joinRoom()">Entrar a la Sala</button>
        </div>

        <!-- Pantalla Principal de Sincronización -->
        <div id="syncScreen" style="display:none;">
            <h2 id="roomTitle">Conectado a: </h2>
            <p>Estado del Lightstick:</p>
            <div class="circle" id="lightCircle"></div>

            <!-- Botón de Conexión Bluetooth para asistentes -->
            <button id="btBtn" class="btn-bluetooth" onclick="connectArmyBomb()">Conectar Lightstick por Bluetooth</button>
            <p id="btStatus" style="font-size: 13px; color: #888;"></p>

            <!-- Panel de Super Admin (solo visible si entran como admin) -->
            <div id="adminPanel" style="display:none; margin-top:20px; border-top: 1px solid #444; padding-top: 15px;">
                <h3>Panel de Control Admin</h3>
                <p>Controlando: <strong>Sala-1</strong></p>
                <p style="margin-bottom: 10px;">Desliza para elegir el color:</p>
                <input type="color" id="colorPicker" value="#ff0000" oninput="sendColor(this.value)" style="width: 80px; height: 80px; border: none; border-radius: 50%; cursor: pointer; background: none; outline: none;">
                <br><br>
                <button style="background-color: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;" onclick="closeAllRooms()">¡Enviar Mensaje Global de Cierre!</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';
        let bluetoothDevice = null;
        let colorCharacteristic = null;

        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if (!room) return alert('Por favor ingresa un nombre de sala');

            currentRoom = room;
            socket.emit('join-room', room);

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('syncScreen').style.display = 'block';
            document.getElementById('roomTitle').innerText = 'Conectado a: ' + room;

            if (room.toLowerCase() === 'admin') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('btBtn').style.display = 'none';
            }
        }

        function sendColor(color) {
            // El admin emite el cambio de color a toda la sala
            socket.emit('change-color', { room: 'admin', targetRoom: 'Sala-1', color: color });
            
            // Si el admin también tiene una Army Bomb conectada en su misma pantalla, la actualiza localmente
            if (typeof sendColorToBluetooth === 'function' && colorCharacteristic) {
                sendColorToBluetooth(color);
            }
        }

        socket.on('update-color', (data) => {
            // Cambia el círculo visual en pantalla
            document.getElementById('lightCircle').style.backgroundColor = data.color;
            
            // Envía el color al lightstick conectado por Bluetooth automáticamente
            if (typeof sendColorToBluetooth === 'function') {
                sendColorToBluetooth(data.color);
            }
        });

        async function connectArmyBomb() {
            try {
                const status = document.getElementById('btStatus');
                status.innerText = 'Buscando Army Bomb SE...';
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000ffe1-0000-1000-8000-00805f9b34fb',
                        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
                        '6e400002-b5a3-f393-e0a9-e50e24dcca9e',
                        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
                        '0000fff0-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb',
                        '00001800-0000-1000-8000-00805f9b34fb'
                    ]
                });

                status.innerText = 'Conectando al dispositivo...';
                const server = await bluetoothDevice.gatt.connect();
                
                status.innerText = 'Buscando canal de color SE...';
                colorCharacteristic = null;

                const services = await server.getPrimaryServices();
                
                // Priorizamos el canal UART / FFE1 específico de la Army Bomb SE
                for (const service of services) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        for (const characteristic of characteristics) {
                            if (characteristic.uuid.includes('ffe1') || characteristic.uuid.includes('6e400002') || characteristic.uuid.includes('fff1')) {
                                if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                                    colorCharacteristic = characteristic;
                                    break;
                                }
                            }
                        }
                        if (colorCharacteristic) break;
                    } catch (err) {
                        console.log("Omitiendo servicio:", err);
                    }
                }

                // Fallback a cualquier canal de escritura si no coincide el UUID exacto
                if (!colorCharacteristic) {
                    for (const service of services) {
                        try {
                            const characteristics = await service.getCharacteristics();
                            for (const characteristic of characteristics) {
                                if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                                    colorCharacteristic = characteristic;
                                    break;
                                }
                            }
                            if (colorCharacteristic) break;
                        } catch (err) {}
                    }
                }

                if (!colorCharacteristic) {
                    throw new Error("No se encontró el canal de escritura SE.");
                }

                status.innerText = '¡Army Bomb SE conectada con éxito!';
                status.style.color = '#00cec9';
            } catch (error) {
                console.error('Error de Bluetooth:', error);
                document.getElementById('btStatus').innerText = 'Error: ' + error.message;
            }
        }

        async function sendColorToBluetooth(hexColor) {
            if (!colorCharacteristic) return;

            let r = parseInt(hexColor.slice(1, 3), 16);
            let g = parseInt(hexColor.slice(3, 5), 16);
            let b = parseInt(hexColor.slice(5, 7), 16);

            // Trama de bytes principal para la Army Bomb SE
            let byteArray = new Uint8Array([0x53, 0x03, r, g, b]);

            try {
                await colorCharacteristic.writeValue(byteArray);
            } catch (error) {
                try {
                    // Trama alternativa de 9 bytes con checksum como respaldo
                    let bytes = [0x01, 0xFF, 0x00, r, g, b, 0x00, 0x00];
                    let checksum = 0;
                    for (let i = 2; i < bytes.length; i++) { checksum += bytes[i]; }
                    checksum = checksum & 0xFF;
                    let packet = new Uint8Array([...bytes, checksum]);
                    await colorCharacteristic.writeValue(packet);
                } catch (err) {
                    console.error('Error al enviar color a la Army Bomb SE:', err);
                }
            }
        }
    </script>
</body>
</html>
